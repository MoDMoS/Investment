services:
  db:
    image: postgres:16-alpine
    container_name: investment_postgres
    environment:
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: investment
      POSTGRES_DB: investment
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - investment_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d investment"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - modmos-db

  api:
    build: ./backend
    container_name: investment_api
    environment:
      DATABASE_URL: postgresql://investment:investment@investment_postgres:5432/investment?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEC_API_KEY: ${SEC_API_KEY:-}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - modmos-db

  web:
    build:
      context: ./frontend
      args:
        VITE_BASE: ${VITE_BASE:-/Investment/}
        VITE_GOLD_AGENT_URL: ${VITE_GOLD_AGENT_URL:-/gold/}
    container_name: investment_web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - modmos-db

networks:
  modmos-db:
    external: true
    name: modmos-db

volumes:
  investment_pg:
